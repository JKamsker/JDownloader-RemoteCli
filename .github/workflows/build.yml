name: Build, Test, Publish

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built package to NuGet.org
        required: false
        default: false
        type: boolean
      release_version:
        description: Release version for manual publish runs
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Compute Version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" && -z "${{ inputs.release_version }}" ]]; then
          echo "release_version is required when publish=true." >&2
          exit 1
        fi

        BASE_VERSION="$(dotnet msbuild src/JDownloader.Cli/JDownloader.Cli.csproj -nologo -getProperty:VersionPrefix)"

        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_version }}" ]]; then
          VERSION="${{ inputs.release_version }}"
        else
          VERSION="${BASE_VERSION}-ci.${{ github.run_number }}"
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore

    - name: Format (verify)
      run: |
        dotnet format whitespace src/JDownloader.Cli/JDownloader.Cli.csproj --verify-no-changes --no-restore --verbosity minimal
        dotnet format style src/JDownloader.Cli/JDownloader.Cli.csproj --verify-no-changes --no-restore --verbosity minimal
        dotnet format whitespace src/JDownloader.Cli.Tests/JDownloader.Cli.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
        dotnet format style src/JDownloader.Cli.Tests/JDownloader.Cli.Tests.csproj --verify-no-changes --no-restore --verbosity minimal

    - name: C# LOC + partial guard
      run: bash scripts/check-csharp-guidelines.sh

    - name: Build
      run: |
        dotnet build --configuration Release \
          /p:Version="${{ env.VERSION }}" \
          /p:AssemblyVersion="${{ env.VERSION }}" \
          /p:FileVersion="${{ env.VERSION }}" \
          /p:InformationalVersion="${{ env.VERSION }}" \
          --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Pack
      run: |
        dotnet pack src/JDownloader.Cli/JDownloader.Cli.csproj --configuration Release --no-build \
          /p:Version="${{ env.VERSION }}" \
          /p:AssemblyVersion="${{ env.VERSION }}" \
          /p:FileVersion="${{ env.VERSION }}" \
          /p:InformationalVersion="${{ env.VERSION }}" \
          --output nuget-packages

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: |
          nuget-packages/*.nupkg
          nuget-packages/*.snupkg
        retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Download NuGet Package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: nuget-packages

    - name: Get Secrets
      uses: bitwarden/sm-action@v2
      with:
        access_token: ${{ secrets.BW_ACCESS_TOKEN }}
        base_url: https://vault.bitwarden.eu
        secrets: |
          265b2fb6-2cf0-4859-9bc8-b24c00ab4378 > NUGET_API_KEY

    - name: Upload to NuGet.org
      run: |
        shopt -s nullglob
        for package in nuget-packages/*.nupkg; do
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
        for symbols in nuget-packages/*.snupkg; do
          dotnet nuget push "$symbols" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
        echo "Upload complete"
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Build Number: ${{ github.run_number }}"
